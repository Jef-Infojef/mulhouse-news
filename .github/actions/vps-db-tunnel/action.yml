name: Tunnel SSH vers le Postgres du VPS
description: >
  Le port 5432 du VPS n'accepte que l'IP de l'administrateur (DOCKER-USER).
  Ouvre un tunnel SSH (clé limitée au seul transfert vers 127.0.0.1:5432) et
  redirige localement <VPS>:5432 vers ce tunnel : les URL de base existantes
  restent inchangées, aucun secret de base à modifier.
inputs:
  ssh-host:
    required: true
  ssh-user:
    required: true
  ssh-key:
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SSH_HOST: ${{ inputs.ssh-host }}
        SSH_USER: ${{ inputs.ssh-user }}
        SSH_KEY: ${{ inputs.ssh-key }}
      run: |
        set -euo pipefail
        install -m 600 /dev/null ~/.vps_db_tunnel_key
        printf '%s\n' "$SSH_KEY" > ~/.vps_db_tunnel_key
        ssh -i ~/.vps_db_tunnel_key -o IdentitiesOnly=yes \
          -o StrictHostKeyChecking=accept-new -o ExitOnForwardFailure=yes \
          -o ServerAliveInterval=30 \
          -fN -L 127.0.0.1:15432:127.0.0.1:5432 "$SSH_USER@$SSH_HOST"
        # <VPS>:5432 -> 127.0.0.1:15432 pour tout processus du runner
        sudo sysctl -qw net.ipv4.conf.all.route_localnet=1
        sudo iptables -t nat -A OUTPUT -p tcp -d "$SSH_HOST" --dport 5432 \
          -j DNAT --to-destination 127.0.0.1:15432
        for i in $(seq 1 20); do
          (echo > /dev/tcp/"$SSH_HOST"/5432) 2>/dev/null && { echo "Tunnel prêt"; exit 0; }
          sleep 0.5
        done
        echo "::error::Tunnel vers le Postgres du VPS injoignable"
        exit 1
