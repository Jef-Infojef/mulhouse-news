name: Scrape Mulhouse News

on:
  schedule:
    # 15 min : le */5 + scans Convex de 500–2000 articles complets par run
    # vidait le Database I/O du plan gratuit (plusieurs Go/jour, coupure 16/08).
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml psycopg2-binary python-dotenv curl_cffi googlenewsdecoder

      - name: Snapshot Convex I/O (avant)
        continue-on-error: true
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: python scripts/log_convex_io.py before

      - name: Run Scraper Script (Discovery)
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          USE_CONVEX: '1'
        run: |
          python scripts/scrape_and_seed.py

      - name: Run mplusinfo.fr scraper
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          USE_CONVEX: '1'
        run: |
          python scripts/scrape_mplusinfo.py --days 14

      - name: Run le-periscope.info scraper
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          USE_CONVEX: '1'
        run: |
          python scripts/scrape_periscope_seed.py --days 14

      - name: Run m2A le mag scraper
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          USE_CONVEX: '1'
        run: |
          python scripts/scrape_mag_m2a.py --days 14

      - name: Run Full Content & Image Scraper
        env:
          ALSACE_COOKIES: ${{ secrets.ALSACE_COOKIES }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_PUBLIC_URL: ${{ secrets.B2_PUBLIC_URL }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          USE_CONVEX: '1'
        run: |
          python scripts/scrape_content_full.py

      - name: Sync RAG index (direct Supabase, sans Vercel)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          USE_CONVEX: '1'
        run: python scripts/rag_sync_articles.py

      - name: Log Convex I/O du run
        if: always()
        continue-on-error: true
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          USE_CONVEX: '1'
        run: python scripts/log_convex_io.py after

      - name: Log failure to DB
        if: failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          USE_CONVEX: '1'
        run: |
          python scripts/log_github_failure.py
