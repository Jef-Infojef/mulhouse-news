name: Scrape Mulhouse News

# Où vont les données, malgré les apparences.
#
# Chaque étape pose CONVEX_DEPLOY_KEY, NEXT_PUBLIC_CONVEX_URL et USE_CONVEX=1,
# ce qui laisse croire que tout part dans Convex. Ce n’est plus le cas depuis la
# coupure pour quota du 11/09/2026 :
#
#   lectures  -> Aiven, dès que RAG_DATABASE_URL est défini (fonctions *_tolerant)
#   ecritures -> journal RAG, puis Aiven à l’étape « Sync RAG index »
#   Convex    -> ne reçoit plus rien (mutations coupées tant que CONVEX_WRITES
#                n’est pas posé)
#
# Ces deux variables Convex restent néanmoins obligatoires : elles sont
# l’interrupteur qui sélectionne la branche moderne des scripts. Les retirer
# ferait retomber les scrapers sur la branche Supabase/psycopg2 (DATABASE_URL),
# pas sur l’Aiven. Voir la docstring de convex_client.use_convex().

on:
  schedule:
    # Retour à 5 min le 16/09/2026. Le passage à 15 min (16/08) visait le
    # Database I/O de Convex, que les scans de 500–2000 articles complets par
    # run vidaient ; les articles ne transitent plus par Convex depuis le 13/09,
    # et le run est retombé de 12–14 min à 2–3 min avec le cache fil d’Ariane.
    #
    # A surveiller : GitHub ne délivre qu’une fraction des déclenchements
    # planifiés (~7/jour pour 96 demandés sous */15). Rien ne garantit que
    # demander plus en obtienne plus — c’est précisément ce que cette bascule
    # mesure. Comparer sur quelques jours :
    #   gh run list --workflow=scrape-news.yml --limit 30
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Un seul run à la fois : à 5 min d’intervalle, un run parti à froid (7 à
# 14 min quand le sitemap du jour paraît) chevaucherait le suivant. Deux runs
# simultanés se marcheraient dessus sur le cache de cooldown, lu puis réécrit
# en entier. Le suivant attend plutôt que d’être annulé : ce qu’il a à
# collecter reste à collecter.
concurrency:
  group: scrape-news
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    # Journal RAG : chaque scraper y consigne l'article qu'il ecrit, AVANT de
    # savoir si Convex a accepte. L'etape « Sync RAG index » l'indexe ensuite en
    # SQL direct sur l'Aiven, sans relire Convex. Sans cela, un deploiement
    # Convex coupe (quota depasse le 11/09/2026) arrete net l'alimentation du
    # RAG : 36 h sans le moindre article, et « les actus du jour » servant
    # l'avant-veille. Defini au niveau du job : toutes les etapes le partagent.
    env:
      # `runner.temp` n'est pas resolu dans un env de niveau job (contextes
      # autorises : github, needs, vars, secrets, inputs) : workspace, donc.
      RAG_JOURNAL_PATH: ${{ github.workspace }}/rag-journal.jsonl
      # Les scrapers y cherchent si un lien est deja connu : depuis le
      # 13/09/2026 c'est la table Article de l'Aiven qui fait autorite, plus
      # Convex. Sans cette variable la dedup serait aveugle et chaque passage
      # re-traiterait tout le sitemap.
      RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml psycopg2-binary python-dotenv curl_cffi googlenewsdecoder

      - name: Snapshot Convex I/O (avant)
        continue-on-error: true
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: python scripts/log_convex_io.py before

      - name: Run Scraper Script (Discovery)
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          USE_CONVEX: '1'
        run: |
          python scripts/scrape_and_seed.py

      # Rattrapage L'Alsace « jour » : le sitemap quotidien liste TOUTES les
      # URLs publiées le jour même (et la veille), contrairement au RSS qui ne
      # renvoie que les derniers items. Garantit de ne rien manquer du jour,
      # même si un article sort du RSS entre deux runs de 15 min.
      - name: Run L'Alsace sitemap (rattrapage jour)
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          USE_CONVEX: '1'
        run: |
          START=$(date -u -d "2 days ago" +%F)
          END=$(date -u +%F)
          python scripts/scrape_alsace_archive.py --start "$START" --end "$END" --check-page

      - name: Run mplusinfo.fr scraper
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          USE_CONVEX: '1'
        run: |
          python scripts/scrape_mplusinfo.py --days 14

      - name: Run le-periscope.info scraper
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          USE_CONVEX: '1'
        run: |
          python scripts/scrape_periscope_seed.py --days 14

      - name: Run m2A le mag scraper
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          USE_CONVEX: '1'
        run: |
          python scripts/scrape_mag_m2a.py --days 14

      - name: Run Full Content & Image Scraper
        env:
          ALSACE_COOKIES: ${{ secrets.ALSACE_COOKIES }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_PUBLIC_URL: ${{ secrets.B2_PUBLIC_URL }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          USE_CONVEX: '1'
        run: |
          python scripts/scrape_content_full.py

      - name: Sync RAG index (direct Aiven, sans Vercel)
        # `always()` : le 13/09/2026, le scraper mplusinfo est mort sur une
        # ecriture de journal Convex (deploiement coupe pour quota) et a
        # emporte cette etape avec lui. Les articles deja collectes par les
        # etapes precedentes — L'Alsace du jour comprise — n'ont donc jamais
        # ete indexes : le chat servait l'avant-veille alors que la collecte
        # avait fonctionne. L'indexation ne depend d'aucun scraper : ce qui est
        # dans le journal doit entrer dans le RAG, meme apres un echec.
        if: always()
        env:
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEWS_DATABASE_URL: ${{ secrets.MULHOUSEGPT_NEWS_DATABASE_URL }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          USE_CONVEX: '1'
        # --journal d'abord (aucune dependance a Convex, commit immediat),
        # puis la lecture Convex habituelle, qui ne retrouvera que des chunks
        # inchanges et les ignorera.
        run: python scripts/rag_sync_articles.py --journal "$RAG_JOURNAL_PATH"

      - name: Log Convex I/O du run
        if: always()
        continue-on-error: true
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          USE_CONVEX: '1'
        run: python scripts/log_convex_io.py after

      - name: Log failure to DB
        if: failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          USE_CONVEX: '1'
        run: |
          python scripts/log_github_failure.py
