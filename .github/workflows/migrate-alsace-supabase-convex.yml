name: Migrate L'Alsace Supabase → Convex

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Nombre max d''articles (0 = tout)'
        required: false
        default: '0'

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 curl_cffi psycopg2-binary python-dotenv requests

      - name: Migrate L'Alsace articles (Supabase → Convex)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          USE_CONVEX: '1'
        run: |
          python scripts/migrate_alsace_supabase_to_convex.py --limit ${{ inputs.limit }}
