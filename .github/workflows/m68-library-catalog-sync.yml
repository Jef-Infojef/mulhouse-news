name: M68 Library Catalog Sync

# Exécute le code du repo privé assocommercants sur les runners publics
# (minutes illimitées) — même pattern que m68-knowledge-sync.yml. Workflow
# séparé (pas fusionné dans le sync quotidien) : le crawl catalogue est
# volontairement mensuel, pas une histoire de minutes GitHub ici mais de
# politesse envers bibliotheques.mulhouse.fr (éviter de marteler tous les
# jours un fonds qui évolue lentement, risque de blocage anti-bot Anubis).
on:
  schedule:
    # Le 3 du mois, 2h UTC
    - cron: "0 2 3 * *"
  workflow_dispatch:
    inputs:
      anubis_cookie:
        description: "Cookie Anubis pré-résolu (plan B si le challenge échoue sur le runner)"
        required: false
      max_records:
        description: "Plafond de notices (défaut 2000)"
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout assocommercants (deploy key lecture seule)
        uses: actions/checkout@v4
        with:
          repository: Jef-Infojef/assocommercants
          ssh-key: ${{ secrets.ASSOCOMMERCANTS_DEPLOY_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Sync catalogue bibliothèques (crawl Anubis/Puppeteer, ~2h30)
        run: npx tsx scripts/library-catalog-sync.ts ${{ inputs.max_records && format('--max-records={0}', inputs.max_records) || '' }}
        env:
          NEWS_DATABASE_URL: ${{ secrets.NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          ANUBIS_COOKIE: ${{ inputs.anubis_cookie }}
