name: M68 Library Catalog Sync

# Exécute le code du repo privé MulhouseGPT sur les runners publics
# (minutes illimitées) — même pattern que m68-knowledge-sync.yml. Workflow
# séparé (pas fusionné dans le sync quotidien) : le crawl catalogue est
# volontairement mensuel, pas une histoire de minutes GitHub ici mais de
# politesse envers bibliotheques.mulhouse.fr (éviter de marteler tous les
# jours un fonds qui évolue lentement, risque de blocage anti-bot Anubis).
on:
  schedule:
    # Le 3 du mois, 2h UTC
    - cron: "0 2 3 * *"
  workflow_dispatch:
    inputs:
      anubis_cookie:
        description: "Cookie Anubis pré-résolu (plan B si le challenge échoue sur le runner)"
        required: false
      max_records:
        description: "Plafond de notices (défaut 2000)"
        required: false

permissions:
  contents: read

env:
  JINA_KEY_ENV: github
  # npm ci ne doit pas télécharger Chrome (403 intermittents). L'étape
  # suivante l'installe explicitement, avec retries.
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout MulhouseGPT (deploy key lecture seule)
        uses: actions/checkout@v4
        with:
          repository: Jef-Infojef/MulhouseGPT
          ssh-key: ${{ secrets.MULHOUSEGPT_DEPLOY_KEY }}

      # Postgres du VPS filtré par IP (DOCKER-USER, 22/09) : tunnel SSH avec une clé
      # limitée au transfert vers 127.0.0.1:5432, puis <VPS>:5432 redirigé vers le
      # tunnel sur le runner. Les URL de base restent inchangées. Script en ligne
      # (pas d'action locale) : certains jobs récupèrent un autre dépôt.
      - name: Tunnel SSH vers le Postgres du VPS
        env:
          SSH_HOST: ${{ secrets.VPS_TUNNEL_HOST }}
          SSH_USER: ${{ secrets.VPS_TUNNEL_USER }}
          SSH_KEY: ${{ secrets.VPS_TUNNEL_KEY }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null ~/.vps_db_tunnel_key
          printf '%s
' "$SSH_KEY" > ~/.vps_db_tunnel_key
          ssh -i ~/.vps_db_tunnel_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new             -o ExitOnForwardFailure=yes -o ServerAliveInterval=30             -fN -L 127.0.0.1:15432:127.0.0.1:5432 "$SSH_USER@$SSH_HOST"
          sudo sysctl -qw net.ipv4.conf.all.route_localnet=1
          sudo iptables -t nat -A OUTPUT -p tcp -d "$SSH_HOST" --dport 5432 -j DNAT --to-destination 127.0.0.1:15432
          for i in $(seq 1 20); do
            (echo > /dev/tcp/"$SSH_HOST"/5432) 2>/dev/null && { echo "Tunnel prêt"; exit 0; }
            sleep 0.5
          done
          echo "::error::Tunnel vers le Postgres du VPS injoignable"; exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome for Puppeteer
        run: |
          for i in 1 2 3; do
            npx puppeteer browsers install chrome && exit 0
            echo "tentative $i/3 échouée, nouvelle essai dans 15s…"
            sleep 15
          done
          exit 1

      - name: Sync catalogue bibliothèques (crawl Anubis/Puppeteer, ~2h30)
        run: npx tsx scripts/library-catalog-sync.ts ${{ inputs.max_records && format('--max-records={0}', inputs.max_records) || '' }}
        env:
          NEWS_DATABASE_URL: ${{ secrets.MULHOUSEGPT_NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          ANUBIS_COOKIE: ${{ inputs.anubis_cookie }}
