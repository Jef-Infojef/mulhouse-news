name: Diagnostic B2 (temporaire)

# Isole la cause de l'échec d'envoi de la sauvegarde Aiven : `aws s3 cp` rend 0
# sans rien transférer ni afficher. Deux variables à départager — la TAILLE
# (multipart au-delà de 8 Mio) et le PRÉFIXE (la clé B2 est peut-être restreinte
# à convex-exports/). Ce workflow teste les quatre combinaisons en une minute,
# au lieu d'un dump de dix minutes par hypothèse.
#
# À supprimer une fois la cause trouvée.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      B2_ENDPOINT: s3.eu-central-003.backblazeb2.com
      B2_BACKUP_BUCKET: mulhouse-news-backups-private

    steps:
      - name: Configurer les credentials B2
        run: |
          aws configure set aws_access_key_id "${{ secrets.B2_APPLICATION_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.B2_APPLICATION_KEY }}"
          aws configure set default.region us-west-002
          aws --version

      - name: Quatre essais - taille x préfixe
        run: |
          head -c 1048576 /dev/urandom > petit.bin          # 1 Mio  : envoi simple
          head -c 209715200 /dev/urandom > gros.bin         # 200 Mio : multipart

          essai() {
            FICHIER="$1"; CLE="$2"; LIBELLE="$3"
            ATTENDU=$(stat -c%s "$FICHIER")
            echo "--- $LIBELLE ($ATTENDU octets) -> $CLE"
            CODE=0
            aws s3 cp "$FICHIER" "s3://$B2_BACKUP_BUCKET/$CLE" "--endpoint-url=https://$B2_ENDPOINT" --no-progress || CODE=$?
            DISTANT=$(aws s3api head-object --bucket "$B2_BACKUP_BUCKET" --key "$CLE" "--endpoint-url=https://$B2_ENDPOINT" --query ContentLength --output text 2>/dev/null || echo 0)
            if [ "$DISTANT" = "$ATTENDU" ]; then
              echo "    OK (code $CODE, $DISTANT octets sur B2)"
            else
              echo "    ECHEC (code $CODE, $DISTANT / $ATTENDU sur B2)"
            fi
          }

          essai petit.bin "aiven-dumps/diag/petit.bin"     "petit vers aiven-dumps"
          essai petit.bin "convex-exports/diag/petit.bin"  "petit vers convex-exports"
          essai gros.bin  "aiven-dumps/diag/gros.bin"      "gros vers aiven-dumps"
          essai gros.bin  "convex-exports/diag/gros.bin"   "gros vers convex-exports"

      - name: Même essai avec les checksums désactivés
        env:
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          ATTENDU=$(stat -c%s gros.bin)
          CODE=0
          aws s3 cp gros.bin "s3://$B2_BACKUP_BUCKET/aiven-dumps/diag/gros-sans-checksum.bin" "--endpoint-url=https://$B2_ENDPOINT" --no-progress || CODE=$?
          DISTANT=$(aws s3api head-object --bucket "$B2_BACKUP_BUCKET" --key "aiven-dumps/diag/gros-sans-checksum.bin" "--endpoint-url=https://$B2_ENDPOINT" --query ContentLength --output text 2>/dev/null || echo 0)
          echo "gros sans checksum : code $CODE, $DISTANT / $ATTENDU"

      - name: Nettoyer les fichiers de test
        if: always()
        run: |
          for CLE in aiven-dumps/diag/petit.bin convex-exports/diag/petit.bin aiven-dumps/diag/gros.bin convex-exports/diag/gros.bin aiven-dumps/diag/gros-sans-checksum.bin; do
            aws s3 rm "s3://$B2_BACKUP_BUCKET/$CLE" "--endpoint-url=https://$B2_ENDPOINT" || true
          done
