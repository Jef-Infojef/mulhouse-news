# apercevrait que le jour d'une vraie panne.

on:
  workflow_dispatch:

jobs:
  echouer:
    runs-on: ubuntu-latest
    steps:
      - name: Step qui reussit
        run: echo "ok"
      - name: Step qui echoue volontairement
        run: exit 1
