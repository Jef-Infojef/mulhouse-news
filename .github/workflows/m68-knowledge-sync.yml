          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync Musée Historique de Mulhouse (crawl lent, ~2 min)
        if: always() && github.event.schedule != '0 3 * * 3'
        run: npx tsx scripts/historical-museum-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.MULHOUSEGPT_NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync Musée des Beaux-Arts de Mulhouse (crawl lent, ~2 min)
        if: always() && github.event.schedule != '0 3 * * 3'
        run: npx tsx scripts/fine-arts-museum-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.MULHOUSEGPT_NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync Musée de la Mine et de la Potasse (crawl lent, ~2,3 min)
        if: always() && github.event.schedule != '0 3 * * 3'
        run: npx tsx scripts/mine-museum-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.MULHOUSEGPT_NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync Musée du Papier Peint (Rixheim, crawl lent, ~6,3 min)
        if: always() && github.event.schedule != '0 3 * * 3'
        run: npx tsx scripts/wallpaper-museum-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.MULHOUSEGPT_NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync Parc de Wesserling (crawl lent, ~6 min)
        if: always() && github.event.schedule != '0 3 * * 3'
        run: npx tsx scripts/wesserling-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.MULHOUSEGPT_NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync La Kunsthalle Mulhouse
        if: always() && github.event.schedule != '0 3 * * 3'
        run: npx tsx scripts/kunsthalle-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.MULHOUSEGPT_NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync motoco (friche artistique DMC)
        if: always() && github.event.schedule != '0 3 * * 3'
        run: npx tsx scripts/motoco-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.MULHOUSEGPT_NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync street art Mulhouse (Visit Alsace, 6 fiches)
        if: always() && github.event.schedule != '0 3 * * 3'
        run: npx tsx scripts/street-art-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.MULHOUSEGPT_NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync annuaire radios Mulhouse (annuradio.fr)
        if: always() && github.event.schedule != '0 3 * * 3'
        run: npx tsx scripts/radio-directory-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.MULHOUSEGPT_NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync élus de Mulhouse (RNE, data.gouv.fr)
        if: always() && github.event.schedule != '0 3 * * 3'
        run: npx tsx scripts/elected-officials-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.MULHOUSEGPT_NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync boîtes aux lettres Mulhouse (La Poste, data.gouv.fr)
        if: always() && github.event.schedule != '0 3 * * 3'
        run: npx tsx scripts/mailboxes-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.MULHOUSEGPT_NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync bureaux de poste Mulhouse (La Poste)
        if: always() && github.event.schedule != '0 3 * * 3'
        run: npx tsx scripts/post-offices-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.MULHOUSEGPT_NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync SIVOM Mulhouse Sud Alsace
        if: always() && github.event.schedule != '0 3 * * 3'
        run: npx tsx scripts/sivom-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.MULHOUSEGPT_NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync piscines m2A
        if: always() && github.event.schedule != '0 3 * * 3'
        run: npx tsx scripts/piscines-m2a-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.MULHOUSEGPT_NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync pages isolées (Soléa, buralistes, tarifs musées…)
        if: always() && github.event.schedule != '0 3 * * 3'
        run: npx tsx scripts/standalone-pages-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.MULHOUSEGPT_NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync PDF isolés (via Vercel, IPs GitHub bloquées par mulhouse.fr)
        if: always() && github.event.schedule != '0 3 * * 3'
        run: |
          response=$(curl -s -w "\n%{http_code}" --max-time 290 \
            -H "Authorization: ${{ secrets.M68_CRON_SECRET }}" \
            "https://mulhousegpt.vercel.app/api/cron/standalone-pdfs")
          echo "$response" | head -1
          [ "$(echo "$response" | tail -1)" = "200" ]

      - name: Sync publications sociales des commerces
        if: always() && github.event.schedule != '0 3 * * 3'
        run: npx tsx scripts/shop-social-sync.ts
        env:
          TURSO_DATABASE_URL: ${{ secrets.MULHOUSEGPT_TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.MULHOUSEGPT_TURSO_AUTH_TOKEN }}
          NEWS_DATABASE_URL: ${{ secrets.MULHOUSEGPT_NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync répertoire des rues Mulhouse (BAN, data.gouv.fr)
        if: always() && github.event.schedule != '0 3 * * 3'
        run: npx tsx scripts/street-directory-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.MULHOUSEGPT_NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync démographie Mulhouse (INSEE, ~50 Mo à télécharger)
        if: always() && github.event.schedule != '0 3 * * 3'
        run: npx tsx scripts/demographics-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.MULHOUSEGPT_NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync Bibliothèques de Mulhouse (pages + agenda)
        if: always() && github.event.schedule != '0 3 * * 3'
        run: npx tsx scripts/libraries-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.MULHOUSEGPT_NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync FAQ aéroport Bâle-Mulhouse (EuroAirport)
        if: always() && github.event.schedule != '0 3 * * 3'
        run: npx tsx scripts/airport-faq-sync.ts
        env:
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync pages pratiques aéroport (transports, parking, bagages, PMR...)
        if: always() && github.event.schedule != '0 3 * * 3'
        run: npx tsx scripts/airport-practical-sync.ts
        env:
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      # Programmation d'un théâtre : c'est le passage de la sync qui SORT du
      # corpus les spectacles joués depuis plus de 60 jours. Sans exécution
      # régulière, la programmation ne devient pas fausse d'un coup — elle se
      # périme lentement, ce qui est pire car rien ne le signale. Deux
      # représentations ont par ailleurs été annulées du jour au lendemain
      # (fortes chaleurs, juin 2026). Site léger : ~80 pages et 3 PDF.
      - name: Sync Théâtre de la Sinne
        if: always() && github.event.schedule != '0 3 * * 3'
        run: npx tsx scripts/theatre-sinne-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.MULHOUSEGPT_NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      # Le site n'expose ni sitemap, ni Last-Modified, ni ETag : une sentinelle
      # (sa page « nouveautés ») décide s'il faut parcourir les ~1 000 pages.
      # Une exécution qui ne trouve rien de neuf coûte 1 requête et 30 s ; un
      # parcours complet, 1 000 requêtes et 20 min. D'où le quotidien.
      - name: Sync Université Populaire du Rhin
        if: always() && github.event.schedule != '0 3 * * 3'
        run: npx tsx scripts/universite-populaire-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.MULHOUSEGPT_NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      # Monuments historiques : le fichier du ministère pèse 95 Mo et couvre la
      # France entière pour n'en garder que 103 notices ; la base bouge de
      # quelques classements par an. Le quotidien coûterait ~35 Go par an pour
      # un contenu qui ne change presque jamais — d'où le 1er du mois. Le test
      # est fait ici plutôt que par un cron dédié : un cron supplémentaire
      # relancerait TOUTES les étapes de ce workflow.
      - name: Sync monuments historiques (Mérimée) — le 1er du mois
        if: always() && github.event.schedule != '0 3 * * 3'
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            npx tsx scripts/merimee-sync.ts
          else
            echo "Mérimée : hors du 1er du mois, synchronisation ignorée (95 Mo pour quelques classements par an)"
          fi
        env:
          NEWS_DATABASE_URL: ${{ secrets.MULHOUSEGPT_NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      # Catalogue Alsace : bibliotheque.alsace.eu renvoie 403 depuis GitHub
      # et Vercel (mesuré 2026-08-12). Sync locale uniquement
      # (`npx tsx scripts/alsace-catalog-sync.ts`).
      - name: Catalogue Bibliotheque d Alsace — hors CI
        if: always() && github.event.schedule != '0 3 * * 3'
        run: echo "Bibliotheque d Alsace — 403 depuis les datacenters, sync locale uniquement"

      # Relit le solde de chaque cle du magasin. Sans ce passage, le total de
      # reserve affiche par /jina reste une estimation a 10 M par cle. En
      # profite pour inscrire le secret JINA_API_KEY dans le magasin s'il n'y
      # est pas encore : il ne vit nulle part ailleurs.
      - name: Rafraîchir le magasin de clés Jina
        if: always()
        continue-on-error: true
        run: npx tsx scripts/jina-keys-refresh.ts
        env:
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Vérifier le solde Jina
        if: always() && github.event.schedule != '0 3 * * 3'
        continue-on-error: true
        run: npx tsx scripts/check-jina-balance.ts
        env:
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_EMAIL_PASSWORD: ${{ secrets.SENDER_EMAIL_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}

      # Détecte les pannes qui laissent le run vert : retard d'embeddings qui
      # s'accumule, corpus qui cesse d'être alimenté. C'est ce qui manquait
      # quand le solde Jina s'est épuisé fin juillet — une semaine de runs
      # verts pendant que le contenu s'indexait sans vecteurs.
      # continue-on-error : on veut le verdict DANS la notification, pas un
      # arrêt qui empêcherait de l'envoyer.
      - name: Garde-fou corpus RAG
        id: guard
        if: always()
        continue-on-error: true
        run: |
          set +e
          npx tsx scripts/rag-ci-guard.ts
          rc=$?
          # Le `printf` final garantit un saut de ligne avant le délimiteur même
          # si le fichier n'en a pas : sinon GitHub rejette le bloc entier avec
          # « Matching delimiter not found » et le step échoue à tort.
          {
            echo "GUARD_REPORT<<GUARD_EOF"
            cat /tmp/rag-guard.txt 2>/dev/null || echo "(rapport indisponible)"
            printf '\n'
            echo "GUARD_EOF"
          } >> "$GITHUB_ENV"
          exit $rc
        env:
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}

      # Une trentaine de syncs tournent dans ce job : savoir QUE le run a
      # echoue, sans savoir laquelle, oblige a ouvrir les logs a chaque fois.
      #
      # ATTENTION : ne jamais ecrire la sequence dollar-accolades dans ce bloc,
      # meme en commentaire. GitHub y cherche une expression et rejette le
      # fichier entier -- pas seulement ce step. Verifier avec actionlint.
      - name: Recenser les steps en échec
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          echecs=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[].steps[] | select(.conclusion=="failure") | "· \(.name)"' \
            2>/dev/null | head -15)
          {
            echo "FAILED_STEPS<<STEPS_EOF"
            if [ -n "$echecs" ]; then
              echo "Steps en échec :"
              echo "$echecs"
              echo
            fi
            printf '\n'
            echo "STEPS_EOF"
          } >> "$GITHUB_ENV"
          exit 0

      - name: Notifier Telegram
        if: always()
        uses: ./.github/actions/telegram
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: >-
            ${{ job.status != 'success' && 'echec'
                || steps.guard.outcome == 'failure' && 'alerte'
                || 'ok' }}
          title: >-
            ${{ job.status != 'success' && 'Sync RAG — échec'
                || steps.guard.outcome == 'failure' && 'Sync RAG — corpus en dérive'
                || 'Sync RAG — terminée' }}
          body: |
            ${{ env.FAILED_STEPS }}${{ env.GUARD_REPORT }}

      # Après la notification, pour qu'elle parte quand même : un corpus qui
      # dérive doit aussi rendre le run ROUGE dans la liste des exécutions.
      # Un vert permanent est précisément ce qui a masqué la panne d'embeddings.
      - name: Échouer si le corpus dérive
        if: always() && steps.guard.outcome == 'failure'
        run: |
          echo "::error::Le garde-fou du corpus RAG a signalé une anomalie"
          exit 1
