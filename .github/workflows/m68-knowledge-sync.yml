name: M68 Knowledge Sync

# Exécute le code du repo privé assocommercants sur les runners publics
# (minutes illimitées). Syncs RAG directes vers les BDD ; seule la sync
# mulhouse.fr passe par une route Vercel (leur pare-feu bloque les IPs
# GitHub Actions).
on:
  schedule:
    # Tous les jours à 2h30 UTC — mulhouse.fr + Wikipédia → RAG
    - cron: "30 2 * * *"
    # Mercredi 3h UTC — rafraîchissement presse mi-semaine
    - cron: "0 3 * * 3"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout assocommercants (deploy key lecture seule)
        uses: actions/checkout@v4
        with:
          repository: Jef-Infojef/assocommercants
          ssh-key: ${{ secrets.ASSOCOMMERCANTS_DEPLOY_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NEWS_DATABASE_URL: ${{ secrets.NEWS_DATABASE_URL }}

      - name: Sync pages mulhouse.fr (via Vercel, IPs GitHub bloquées)
        run: |
          response=$(curl -s -w "\n%{http_code}" --max-time 290 \
            "https://www.mulhouse68.fr/api/cron/city-sync?key=${{ secrets.M68_CRON_SECRET }}")
          echo "$response" | head -1
          [ "$(echo "$response" | tail -1)" = "200" ]

      - name: Sync Wikipédia
        if: always()
        run: npx tsx scripts/wiki-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync articles presse (RAG)
        if: always()
        run: npx tsx scripts/rag-sync-articles.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync sorties à venir (RAG)
        if: always()
        run: npx tsx scripts/outings-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync Office de Tourisme (pages + guides PDF)
        if: always()
        run: npx tsx scripts/tourism-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync plaques bilingues (plaquesbilingues.fr)
        if: always()
        run: npx tsx scripts/bilingual-plaques-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync Zoo de Mulhouse (pages + PDF)
        if: always()
        run: npx tsx scripts/zoo-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync Musée National de l'Automobile (crawl lent, ~10 min)
        if: always()
        run: npx tsx scripts/museum-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync Cité du Train (musée ferroviaire)
        if: always()
        run: npx tsx scripts/railway-museum-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync Musée Electropolis (bloqué depuis mon environnement, test réel ici)
        if: always()
        run: npx tsx scripts/electropolis-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync Musée de l'Impression sur Étoffes (MISE)
        if: always()
        run: npx tsx scripts/textile-museum-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync Musée Historique de Mulhouse (crawl lent, ~2 min)
        if: always()
        run: npx tsx scripts/historical-museum-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync Musée des Beaux-Arts de Mulhouse (crawl lent, ~2 min)
        if: always()
        run: npx tsx scripts/fine-arts-museum-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync Musée de la Mine et de la Potasse (crawl lent, ~2,3 min)
        if: always()
        run: npx tsx scripts/mine-museum-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync Musée du Papier Peint (Rixheim, crawl lent, ~6,3 min)
        if: always()
        run: npx tsx scripts/wallpaper-museum-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync Parc de Wesserling (crawl lent, ~6 min)
        if: always()
        run: npx tsx scripts/wesserling-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync La Kunsthalle Mulhouse
        if: always()
        run: npx tsx scripts/kunsthalle-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync motoco (friche artistique DMC)
        if: always()
        run: npx tsx scripts/motoco-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync street art Mulhouse (Visit Alsace, 6 fiches)
        if: always()
        run: npx tsx scripts/street-art-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync annuaire radios Mulhouse (annuradio.fr)
        if: always()
        run: npx tsx scripts/radio-directory-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync élus de Mulhouse (RNE, data.gouv.fr)
        if: always()
        run: npx tsx scripts/elected-officials-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
