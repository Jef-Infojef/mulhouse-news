          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync Musée Electropolis (bloqué depuis mon environnement, test réel ici)
        if: always() && github.event.schedule != '0 3 * * 3'
        run: npx tsx scripts/electropolis-sync.ts
        env:
