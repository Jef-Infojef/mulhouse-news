name: M68 Knowledge Sync

# Exécute le code du repo privé MulhouseGPT sur les runners publics
# (minutes illimitées) — le moteur RAG y vit désormais (plus dans
# assocommercants). Syncs RAG directes vers les BDD (Turso/News en
# lecture seule) ; seule la sync mulhouse.fr passe par une route Vercel
# (leur pare-feu bloque les IPs GitHub Actions).
on:
  schedule:
    # Tous les jours à 2h30 UTC — mulhouse.fr + Wikipédia → RAG
    - cron: "30 2 * * *"
    # Mercredi 3h UTC — rafraîchissement presse mi-semaine
    - cron: "0 3 * * 3"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout MulhouseGPT (deploy key lecture seule)
        uses: actions/checkout@v4
        with:
          repository: Jef-Infojef/MulhouseGPT
          ssh-key: ${{ secrets.MULHOUSEGPT_DEPLOY_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync pages mulhouse.fr (via Vercel, IPs GitHub bloquées)
        if: github.event.schedule != '0 3 * * 3'
        run: |
          response=$(curl -s -w "\n%{http_code}" --max-time 290 \
            -H "Authorization: ${{ secrets.M68_CRON_SECRET }}" \
            "https://mulhousegpt.vercel.app/api/cron/city-sync")
          echo "$response" | head -1
          [ "$(echo "$response" | tail -1)" = "200" ]

      - name: Sync Wikipédia
        if: always() && github.event.schedule != '0 3 * * 3'
        run: npx tsx scripts/wiki-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.MULHOUSEGPT_NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync articles presse (RAG)
        if: always()
        run: npx tsx scripts/rag-sync-articles.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.MULHOUSEGPT_NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync sorties à venir (RAG)
        if: always() && github.event.schedule != '0 3 * * 3'
        run: npx tsx scripts/outings-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.MULHOUSEGPT_NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync Office de Tourisme (pages + guides PDF)
        if: always() && github.event.schedule != '0 3 * * 3'
        run: npx tsx scripts/tourism-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.MULHOUSEGPT_NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync plaques bilingues (plaquesbilingues.fr)
        if: always() && github.event.schedule != '0 3 * * 3'
        run: npx tsx scripts/bilingual-plaques-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.MULHOUSEGPT_NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync Zoo de Mulhouse (pages + PDF)
        if: always() && github.event.schedule != '0 3 * * 3'
        run: npx tsx scripts/zoo-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.MULHOUSEGPT_NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Sync Musée National de l'Automobile (crawl lent, ~10 min)
        if: always() && github.event.schedule != '0 3 * * 3'
        run: npx tsx scripts/museum-sync.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.MULHOUSEGPT_NEWS_DATABASE_URL }}
