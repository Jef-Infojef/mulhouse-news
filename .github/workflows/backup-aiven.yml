name: Sauvegarde Aiven (RAG) - Hebdomadaire

# L'Aiven porte désormais TOUT : le corpus RAG et ses vecteurs, le magasin de
# fiches d'articles (Article, ArticleImage, ArticleTag, NewsTag), le GTFS et le
# ChatLog. Depuis le 13/09/2026 ni le chat ni les sites ne dépendent plus de
# Convex — c'est le seul point dont la perte serait irréparable.
#
# Aiven prend ses propres sauvegardes managées ; celle-ci est HORS de chez eux,
# restaurable sur n'importe quel PostgreSQL 17. Stockée sur le compte B2
# « archives » (celui des PDF du conseil municipal), un seul dump conservé :
# le compte principal a dépassé ses 10 Go gratuits le 20/09/2026 et toutes
# les sauvegardes ont échoué pendant dix jours (storage_cap_exceeded).

on:
  schedule:
    - cron: '0 3 * * 0' # dimanche 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      B2_ENDPOINT: s3.eu-central-003.backblazeb2.com
      # Bucket privé du compte B2 « archives » (secrets B2_ARCHIVE_*), pas celui
      # du compte principal, qui porte déjà les images et les sauvegardes Turso.
      B2_BACKUP_BUCKET: mulhousegpt-rag-backups
      PGBIN: /usr/lib/postgresql/17/bin

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      # Postgres du VPS filtré par IP (DOCKER-USER, 22/09) : tunnel SSH avec une clé
      # limitée au transfert vers 127.0.0.1:5432, puis <VPS>:5432 redirigé vers le
      # tunnel sur le runner. Les URL de base restent inchangées. Script en ligne
      # (pas d'action locale) : certains jobs récupèrent un autre dépôt.
      - name: Tunnel SSH vers le Postgres du VPS
        env:
          SSH_HOST: ${{ secrets.VPS_TUNNEL_HOST }}
          SSH_USER: ${{ secrets.VPS_TUNNEL_USER }}
          SSH_KEY: ${{ secrets.VPS_TUNNEL_KEY }}
        run: |
          set -euo pipefail
          # Déjà ouvert par une étape précédente du même job (jobs à deux checkouts)
          if sudo iptables -t nat -C OUTPUT -p tcp -d "$SSH_HOST" --dport 5432 -j DNAT --to-destination 127.0.0.1:15432 2>/dev/null; then echo "Tunnel déjà ouvert"; exit 0; fi
          install -m 600 /dev/null ~/.vps_db_tunnel_key
          echo "$SSH_KEY" > ~/.vps_db_tunnel_key
          # Le port 22 du VPS ignore parfois la connexion d'un runner (~2-3 % des
          # passages depuis le 23/09) : délai court et trois tentatives plutôt
          # qu'un échec au bout de 2 min 16 s.
          for tentative in 1 2 3; do
            ssh -i ~/.vps_db_tunnel_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -o ConnectTimeout=20 -fN -L 127.0.0.1:15432:127.0.0.1:5432 "$SSH_USER@$SSH_HOST" && break
            if [ "$tentative" -eq 3 ]; then echo "::error::Tunnel SSH vers le VPS : 3 tentatives sans réponse"; exit 1; fi
            echo "::warning::Tunnel SSH vers le VPS : tentative $tentative sans réponse, nouvel essai dans 10 s"
            sleep 10
          done
          sudo sysctl -qw net.ipv4.conf.all.route_localnet=1
          sudo iptables -t nat -A OUTPUT -p tcp -d "$SSH_HOST" --dport 5432 -j DNAT --to-destination 127.0.0.1:15432
          for _ in $(seq 1 20); do
            (echo > /dev/tcp/"$SSH_HOST"/5432) 2>/dev/null && { echo "Tunnel prêt"; exit 0; }
            sleep 0.5
          done
          echo "::error::Tunnel vers le Postgres du VPS injoignable"; exit 1

      - name: Installer pg_dump 17
        # Le runner fournit pg_dump 16, qui REFUSE de lire un serveur 17.10.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          "$PGBIN/pg_dump" --version

      - name: Nom du fichier de sauvegarde
        id: backup-file
        run: |
          echo "filename=aiven-rag-$(date +%Y-%m-%d_%H-%M-%S).dump" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Dump de la base RAG
        env:
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          FICHIER: ${{ steps.backup-file.outputs.filename }}
        run: |
          if [ -z "$RAG_DATABASE_URL" ]; then
            echo "::error::Secret RAG_DATABASE_URL absent — sauvegarde impossible."
            exit 1
          fi

          "$PGBIN/pg_dump" -Fc -Z 6 --no-owner --no-privileges -d "$RAG_DATABASE_URL" -f "$FICHIER"
          ls -lh "$FICHIER"

          # Un dump complet pèse ~1,6 Gio (300 000 chunks dont 299 854 vectorisés).
          # En dessous de 1 Gio, quelque chose a été tronqué : mieux vaut échouer
          # bruyamment que remplacer une sauvegarde valide par une coquille.
          TAILLE=$(stat -c%s "$FICHIER")
          if [ "$TAILLE" -lt 1000000000 ]; then
            echo "::error::Sauvegarde suspecte : $TAILLE octets (< 1 Gio)."
            exit 1
          fi

      - name: Vérifier que le dump est relisible
        env:
          FICHIER: ${{ steps.backup-file.outputs.filename }}
        # Le sommaire d'un dump custom est écrit en TÊTE de fichier : un dump
        # tronqué le présente intact, et contrôler une seule table peut passer si
        # elle a été écrite tôt. C'est arrivé le 13/09/2026 — un fichier
        # incomplet déclaré valide. On relit donc TOUT : pg_restore échoue sur
        # une archive tronquée ou corrompue.
        run: |
          TABLES=$("$PGBIN/pg_restore" -l "$FICHIER" | grep -c "TABLE DATA")
          echo "Tables avec données : $TABLES"
          if [ "$TABLES" -lt 15 ]; then
            echo "::error::Sommaire incomplet : $TABLES tables seulement."
            exit 1
          fi
          "$PGBIN/pg_restore" --data-only -f /dev/null "$FICHIER"
          echo "Archive relue intégralement, sans erreur."

      - name: Configurer les credentials B2
        run: |
          aws configure set aws_access_key_id "${{ secrets.B2_ARCHIVE_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.B2_ARCHIVE_APPLICATION_KEY }}"
          aws configure set default.region us-west-002

      - name: Uploader vers B2 et vérifier l'arrivée
        env:
          FICHIER: ${{ steps.backup-file.outputs.filename }}
          DATE_JOUR: ${{ steps.backup-file.outputs.date }}
          # L'AWS CLI récent joint un checksum CRC32 à chaque partie, que l'API
          # S3 de Backblaze refuse : l'envoi multipart échoue alors en quelques
          # secondes, sans message. Les petits fichiers (sauvegarde Convex,
          # 40 Mo) passent en une seule requête et ne rencontrent pas le
          # problème — d'où un workflow voisin qui fonctionne depuis des mois.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        # `aws s3 cp` est sorti avec un code de SUCCÈS après n'avoir transféré que
        # 10 Mio sur 1,6 Gio (13/09/2026) : le workflow s'est déclaré vert et rien
        # n'est arrivé sur B2. On ne fait donc plus confiance au code de retour —
        # la taille de l'objet distant est comparée à celle du fichier local, et
        # l'envoi est retenté tant qu'elles diffèrent.
        run: |
          CLE="aiven-dumps/$DATE_JOUR/$FICHIER"
          ATTENDU=$(stat -c%s "$FICHIER")

          aws --version

          for essai in 1 2 3; do
            echo "Envoi, tentative $essai (attendu : $ATTENDU octets)"
            # `set -e` est actif : sans ce `&&/||`, un envoi en échec couperait
            # l'étape avant les tentatives suivantes.
            CODE=0
            aws s3 cp "$FICHIER" "s3://$B2_BACKUP_BUCKET/$CLE" "--endpoint-url=https://$B2_ENDPOINT" --no-progress || CODE=$?
            echo "aws s3 cp a rendu le code $CODE"

            DISTANT=$(aws s3api head-object --bucket "$B2_BACKUP_BUCKET" --key "$CLE" "--endpoint-url=https://$B2_ENDPOINT" --query ContentLength --output text 2>/dev/null || echo 0)
            echo "Taille sur B2 : $DISTANT"

            if [ "$DISTANT" = "$ATTENDU" ]; then
              echo "Sauvegarde vérifiée sur B2 ($DISTANT octets)."
              exit 0
            fi
            echo "::warning::Tentative $essai incomplète ($DISTANT / $ATTENDU)."
          done

          echo "::error::Envoi vers B2 incomplet après 3 tentatives."
          exit 1

      - name: Ne garder que le dump qui vient d'être vérifié
        # Un dump pèse ~1,8 Go et le compte « archives » porte déjà ~2 Go de PDF
        # du conseil municipal, sous un plafond gratuit de 10 Go : on ne garde
        # qu'une copie. Cette étape ne tourne qu'après l'étape précédente, qui
        # a comparé la taille distante à la taille locale : l'ancien dump n'est
        # jamais effacé avant que le nouveau soit arrivé entier.
        env:
          FICHIER: ${{ steps.backup-file.outputs.filename }}
          DATE_JOUR: ${{ steps.backup-file.outputs.date }}
        run: |
          GARDE="aiven-dumps/$DATE_JOUR/$FICHIER"
          aws s3 ls "s3://$B2_BACKUP_BUCKET/aiven-dumps/" "--endpoint-url=https://$B2_ENDPOINT" --recursive > aiven-dump-list.txt || true

          while IFS= read -r line; do
            FILE_KEY=$(echo "$line" | awk '{print $4}')
            if [ -n "$FILE_KEY" ] && [ "$FILE_KEY" != "$GARDE" ]; then
              echo "Suppression : $FILE_KEY"
              aws s3 rm "s3://$B2_BACKUP_BUCKET/$FILE_KEY" "--endpoint-url=https://$B2_ENDPOINT" || true
            fi
          done < aiven-dump-list.txt

      - name: Notifier l'échec
        # Une sauvegarde qui échoue en silence ne vaut rien : c'est le jour de la
        # restauration qu'on découvrirait le trou.
        if: failure()
        uses: ./.github/actions/telegram
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: echec
          title: Sauvegarde Aiven en échec
          body: |
            Le dump hebdomadaire de la base RAG n'a pas abouti.
            Run : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
