name: M68 Watchdog

# Détecte ce que Telegram-sur-échec ne voit pas :
#   • un cron qui n'a plus de run vert (YAML invalide, Actions off, quota)
#
# Constaté le 2026-08-16 : knowledge-sync mort 4 jours sans alerte ;
# scrape-news en échec, visible seulement une fois le job rouge. Le contrôle
# de l'I/O Convex a été retiré le 24/09/2026 (Convex coupé et purgé).

on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Contrôler les crons
        id: check
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_watchdog.py

      - name: Notifier Telegram
        if: steps.check.outcome == 'failure'
        uses: ./.github/actions/telegram
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: alerte
          title: Watchdog — cron sans run vert
          body: ${{ env.WATCHDOG_BODY }}

      - name: Échouer le job si alerte
        if: steps.check.outcome == 'failure'
        run: exit 1
