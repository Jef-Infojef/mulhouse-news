name: Scrape Outings (Agenda)

on:
  schedule:
    # Tous les jours à 3h UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape-outings:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml psycopg2-binary python-dotenv curl_cffi

      - name: Scrape agendas (M+ Info, m2A le mag, JDS.fr)
        env:
          # Double écriture : Supabase (chemin primaire — assocommercants.fr
          # sert encore les sorties depuis Supabase) + Convex (miroir RAG).
          # DATABASE_URL reste donc REQUIS ; USE_CONVEX=1 active le miroir
          # Convex dans outing_scrape_utils (voir scripts/outing_scrape_utils.py).
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ASSOCIATION_ID: ${{ secrets.ASSOCIATION_ID }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          USE_CONVEX: "1"
        run: |
          python scripts/scrape_outings.py --source all --past-days=7 --ahead-days=120

      - name: Invalider le cache sorties
        if: success()
        run: |
          curl -sf "https://www.mulhouse68.fr/api/cron/revalidate?tag=outings" \
            -H "Authorization: ${{ secrets.CRON_SECRET }}" \
            && echo "Cache sorties invalidé" \
            || echo "Revalidation cache ignorée"

      - name: Checkout MulhouseGPT (deploy key)
        if: success()
        uses: actions/checkout@v4
        with:
          repository: Jef-Infojef/MulhouseGPT
          ssh-key: ${{ secrets.MULHOUSEGPT_DEPLOY_KEY }}
          path: mulhousegpt

      - name: Setup Node.js
        if: success()
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mulhousegpt/package-lock.json

      - name: Install MulhouseGPT dependencies
        if: success()
        working-directory: mulhousegpt
        run: npm ci

      - name: Sync sorties à venir (RAG)
        if: success()
        working-directory: mulhousegpt
        env:
          JINA_KEY_ENV: github
          PUPPETEER_SKIP_DOWNLOAD: "true"
          NEWS_DATABASE_URL: ${{ secrets.MULHOUSEGPT_NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
        run: npx tsx scripts/outings-sync.ts

      - name: Log failure to DB
        if: failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/log_github_failure.py