name: M68 Publish Scheduled

# Exécute le code du repo privé assocommercants sur les runners publics
# (minutes illimitées). Les scripts tapent directement dans les BDD —
# Vercel n'est pas sollicité.
on:
  schedule:
    # Toutes les 15 minutes
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout assocommercants (deploy key lecture seule)
        uses: actions/checkout@v4
        with:
          repository: Jef-Infojef/assocommercants
          ssh-key: ${{ secrets.ASSOCOMMERCANTS_DEPLOY_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NEWS_DATABASE_URL: ${{ secrets.NEWS_DATABASE_URL }}

      - name: Publish scheduled articles
        run: npx tsx scripts/publish-scheduled.ts
        env:
          NEWS_DATABASE_URL: ${{ secrets.NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
