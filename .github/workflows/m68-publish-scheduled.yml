name: M68 Publish Scheduled

# Exécute le code du repo privé assocommercants sur les runners publics
# (minutes illimitées). Les scripts tapent directement dans les BDD —
# Vercel n'est pas sollicité.
on:
  schedule:
    # Toutes les 15 minutes
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Exposé en env de job pour le `if` du pont Convex : `secrets` n'est
      # pas autorisé dans une condition (workflow invalide depuis le 12/08,
      # plus aucun run planifié toutes les 15 min).
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - name: Checkout assocommercants (deploy key lecture seule)
        uses: actions/checkout@v4
        with:
          repository: Jef-Infojef/assocommercants
          ssh-key: ${{ secrets.ASSOCOMMERCANTS_DEPLOY_KEY }}

      # Postgres du VPS filtré par IP (DOCKER-USER, 22/09) : tunnel SSH avec une clé
      # limitée au transfert vers 127.0.0.1:5432, puis <VPS>:5432 redirigé vers le
      # tunnel sur le runner. Les URL de base restent inchangées. Script en ligne
      # (pas d'action locale) : certains jobs récupèrent un autre dépôt.
      - name: Tunnel SSH vers le Postgres du VPS
        env:
          SSH_HOST: ${{ secrets.VPS_TUNNEL_HOST }}
          SSH_USER: ${{ secrets.VPS_TUNNEL_USER }}
          SSH_KEY: ${{ secrets.VPS_TUNNEL_KEY }}
        run: |
          set -euo pipefail
          # Déjà ouvert par une étape précédente du même job (jobs à deux checkouts)
          if sudo iptables -t nat -C OUTPUT -p tcp -d "$SSH_HOST" --dport 5432 -j DNAT --to-destination 127.0.0.1:15432 2>/dev/null; then echo "Tunnel déjà ouvert"; exit 0; fi
          install -m 600 /dev/null ~/.vps_db_tunnel_key
          echo "$SSH_KEY" > ~/.vps_db_tunnel_key
          ssh -i ~/.vps_db_tunnel_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -fN -L 127.0.0.1:15432:127.0.0.1:5432 "$SSH_USER@$SSH_HOST"
          sudo sysctl -qw net.ipv4.conf.all.route_localnet=1
          sudo iptables -t nat -A OUTPUT -p tcp -d "$SSH_HOST" --dport 5432 -j DNAT --to-destination 127.0.0.1:15432
          for _ in $(seq 1 20); do
            (echo > /dev/tcp/"$SSH_HOST"/5432) 2>/dev/null && { echo "Tunnel prêt"; exit 0; }
            sleep 0.5
          done
          echo "::error::Tunnel vers le Postgres du VPS injoignable"; exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NEWS_DATABASE_URL: ${{ secrets.NEWS_DATABASE_URL }}

      - name: Publish scheduled articles
        run: npx tsx scripts/publish-scheduled.ts
        env:
          # Turso porte les articles d'assocommercants : sans ces deux
          # variables, publish-scheduled.ts échoue À L'IMPORT (lib/prisma.ts
          # est chargé au niveau module par lib/rag/indexer.ts) et pas une
          # publication n'a lieu. Elles n'étaient déclarées que sur le step
          # « npm ci », qui n'en a aucun usage : le job échouait donc à chaque
          # exécution programmée, soit toutes les 15 minutes.
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NEWS_DATABASE_URL: ${{ secrets.NEWS_DATABASE_URL }}
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      # ─── Pont NewsArticle Supabase → Convex (12/08/2026) ──────────────────
      # publish-scheduled.ts écrit les NewsArticle PUBLISHED dans Supabase ;
      # le RAG de MulhouseGPT lit désormais `newsArticles` (Convex), restée
      # vide. Ce step copie les news publiées vers Convex à chaque run
      # (scripts/sync_news_to_convex.ts, repo public mulhouse-news).
      - name: Checkout mulhouse-news (script pont Supabase → Convex)
        uses: actions/checkout@v4
        with:
          repository: Jef-Infojef/mulhouse-news
          path: mulhouse-news

      # Postgres du VPS filtré par IP (DOCKER-USER, 22/09) : tunnel SSH avec une clé
      # limitée au transfert vers 127.0.0.1:5432, puis <VPS>:5432 redirigé vers le
      # tunnel sur le runner. Les URL de base restent inchangées. Script en ligne
      # (pas d'action locale) : certains jobs récupèrent un autre dépôt.
      - name: Tunnel SSH vers le Postgres du VPS
        env:
          SSH_HOST: ${{ secrets.VPS_TUNNEL_HOST }}
          SSH_USER: ${{ secrets.VPS_TUNNEL_USER }}
          SSH_KEY: ${{ secrets.VPS_TUNNEL_KEY }}
        run: |
          set -euo pipefail
          # Déjà ouvert par une étape précédente du même job (jobs à deux checkouts)
          if sudo iptables -t nat -C OUTPUT -p tcp -d "$SSH_HOST" --dport 5432 -j DNAT --to-destination 127.0.0.1:15432 2>/dev/null; then echo "Tunnel déjà ouvert"; exit 0; fi
          install -m 600 /dev/null ~/.vps_db_tunnel_key
          echo "$SSH_KEY" > ~/.vps_db_tunnel_key
          ssh -i ~/.vps_db_tunnel_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -fN -L 127.0.0.1:15432:127.0.0.1:5432 "$SSH_USER@$SSH_HOST"
          sudo sysctl -qw net.ipv4.conf.all.route_localnet=1
          sudo iptables -t nat -A OUTPUT -p tcp -d "$SSH_HOST" --dport 5432 -j DNAT --to-destination 127.0.0.1:15432
          for _ in $(seq 1 20); do
            (echo > /dev/tcp/"$SSH_HOST"/5432) 2>/dev/null && { echo "Tunnel prêt"; exit 0; }
            sleep 0.5
          done
          echo "::error::Tunnel vers le Postgres du VPS injoignable"; exit 1

      - name: Install dependencies (mulhouse-news)
        working-directory: mulhouse-news
        run: npm ci
        env:
          # @prisma/client (postinstall) lance `prisma generate`, qui lit
          # env("DATABASE_URL") dans prisma/schema.prisma : on lui passe le
          # pooler Supabase (même base que NEWS_DATABASE_URL).
          DATABASE_URL: ${{ secrets.NEWS_DATABASE_URL }}

      - name: Sync NewsArticle publiées Supabase → Convex
        if: env.CONVEX_DEPLOY_KEY != ''
        working-directory: mulhouse-news
        run: npx tsx scripts/sync_news_to_convex.ts
        env:
          DATABASE_URL: ${{ secrets.NEWS_DATABASE_URL }}
          CONVEX_DEPLOY_KEY: ${{ env.CONVEX_DEPLOY_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
