name: Test Scraper Connection
on: 
  workflow_dispatch: # Permet le lancement manuel

permissions:
  contents: read

jobs:
  test-connection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Postgres du VPS filtré par IP : accès par tunnel SSH (clé limitée au transfert)
      - name: Tunnel SSH vers le Postgres du VPS
        uses: ./.github/actions/vps-db-tunnel
        with:
          ssh-host: ${{ secrets.VPS_TUNNEL_HOST }}
          ssh-user: ${{ secrets.VPS_TUNNEL_USER }}
          ssh-key: ${{ secrets.VPS_TUNNEL_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests psycopg2-binary beautifulsoup4 curl_cffi

      - name: Run Test Script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALSACE_COOKIES: ${{ secrets.ALSACE_COOKIES }}
        run: python scripts/test_github_action.py
