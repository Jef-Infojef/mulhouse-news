name: M68 Alsace Catalog Sync

# Exécute le code du repo privé MulhouseGPT sur les runners publics
# (minutes illimitées) — même pattern que m68-library-catalog-sync.yml.
# Catalogue de la Bibliothèque d'Alsace (bibliotheque.alsace.eu, recherche
# « mulhouse ») : crawl HTTP simple, sans Anubis ni Puppeteer. Le cron ne
# peut PAS tourner côté Vercel : l'IP Vercel est bloquée par le pare-feu du
# site (HTTP 403 constaté le 2026-08-12). Cadence hebdomadaire — le fonds
# bouge lentement, 136 requêtes/semaine suffisent.
on:
  schedule:
    # Lundi 3h UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      max_records:
        description: "Plafond de notices (défaut 500)"
        required: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout MulhouseGPT (deploy key lecture seule)
        uses: actions/checkout@v4
        with:
          repository: Jef-Infojef/MulhouseGPT
          ssh-key: ${{ secrets.MULHOUSEGPT_DEPLOY_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync catalogue Bibliothèque d'Alsace
        run: npx tsx scripts/alsace-catalog-sync.ts ${{ inputs.max_records && format('--max-records={0}', inputs.max_records) || '' }}
        env:
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          JINA_KEY_ENV: github
