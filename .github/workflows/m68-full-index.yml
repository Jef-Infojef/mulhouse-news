name: M68 Full Index

# Index complet toutes sources + purge + embeddings — équivalent hebdomadaire
# de m68-knowledge-sync.yml (qui ne couvre que les sources synchronisées au
# quotidien). Couvre en plus : agglo/uha/associations/open-data/OSM/
# monuments/conseil municipal/emploi (France Travail), sources sans sync
# quotidienne dédiée.
#
# Groupes ciblés via --sources=, EN SÉRIE (max-parallel: 1).
# Le split parallèle (2026-07-24) évitait le timeout 2h d'un job unique, mais
# 4 groupes tapaient KnowledgeChunk en même temps : statement_timeout Aiven
# en boucle, puis tuerie à 60 min (mesuré 2026-09-06, run 34021705536 —
# core-articles / core-data / culture-tourisme / emploi). Un seul groupe à
# la fois, chacun garde 60 min. Les groupes courts passent en premier pour
# ne pas être coincés derrière un crawl UHA / France Travail.
# city_page n'est plus ici : le daily Vercel (city-sync) fait le même lastmod,
# et mulhouse.fr bloque les IPs GitHub.
on:
  schedule:
    # Dimanche 4h UTC — index complet toutes sources + purge + embeddings
    - cron: "0 4 * * 0"
  workflow_dispatch:

env:
  JINA_KEY_ENV: github
  # Full Index n'ouvre jamais Chrome (le catalogue bibliothèques est un
  # workflow mensuel à part). Sans ce skip, le postinstall Puppeteer
  # télécharge Chrome et un 403 storage.googleapis.com tue npm ci —
  # constaté le 2026-08-16 sur Index (core-data), 21 s, run #9.
  PUPPETEER_SKIP_DOWNLOAD: "true"
  TURSO_DATABASE_URL: ${{ secrets.MULHOUSEGPT_TURSO_DATABASE_URL }}
  TURSO_AUTH_TOKEN: ${{ secrets.MULHOUSEGPT_TURSO_AUTH_TOKEN }}
  NEWS_DATABASE_URL: ${{ secrets.MULHOUSEGPT_NEWS_DATABASE_URL }}
  RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
  JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
  FRANCE_TRAVAIL_CLIENT_ID: ${{ secrets.FRANCE_TRAVAIL_CLIENT_ID }}
  FRANCE_TRAVAIL_CLIENT_SECRET: ${{ secrets.FRANCE_TRAVAIL_CLIENT_SECRET }}
  # Articles presse/actualités lus via Convex (scrapers Phase 4) — le job
  # core-articles (sources article,news_article) en a besoin ; NEWS_DATABASE_URL
  # reste en fallback + Cinema/Outing (outings-sync).
  CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
  NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}

permissions:
  contents: read

jobs:
  index:
    strategy:
      # Un timeout n'annule pas la file. max-parallel: 1 = un seul writer SQL.
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: core-pages
            sources: wiki,landmark_directory
          - name: administratif
            sources: conseil_municipal_pdf,conseil_municipal_archive,library_page,library_event,airport_page,insee_profile
          - name: musees
            sources: museum_page,railway_page,electropolis_page,textile_museum_page,historical_museum_page,fine_arts_museum_page,mine_museum_page,wallpaper_museum_page,wesserling_page,kunsthalle_page,motoco_page,theatre_sinne_page,theatre_poche_ruelle_page,filature_page,temple_saint_etienne_page,noumatrouff_page,lentrepot_page
          - name: core-articles
            sources: article,news_article
          - name: core-data
            sources: shop,shop_social,event,document,magazine,open_data,osm_poi,outing
          - name: culture-tourisme
            sources: tourism_page,bilingual_plaque,zoo_page,street_art_page,radio_directory,elected_officials,mailbox_directory,post_office_directory,street_directory,quartier_directory,demographics,association_directory,agglo_page,sivom_page,uha_page,universite_populaire_page,piscines_m2a
          - name: emploi
            sources: job_offer,labour_market_stats,territory_employment,employment_access,hiring_company,employment_event
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: Index (${{ matrix.name }})

    steps:
      - name: Checkout MulhouseGPT (deploy key lecture seule)
        uses: actions/checkout@v4
        with:
          repository: Jef-Infojef/MulhouseGPT
          ssh-key: ${{ secrets.MULHOUSEGPT_DEPLOY_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Index RAG — groupe ${{ matrix.name }}
        run: npx tsx scripts/rag-index.ts --sources=${{ matrix.sources }} --skip-embeddings

  embeddings:
    needs: index
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: Backfill embeddings
    steps:
      - name: Checkout MulhouseGPT (deploy key lecture seule)
        uses: actions/checkout@v4
        with:
          repository: Jef-Infojef/MulhouseGPT
          ssh-key: ${{ secrets.MULHOUSEGPT_DEPLOY_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Calculer les embeddings manquants
        run: npx tsx scripts/rag-backfill-embeddings.ts
