name: M68 Full Index

# Index complet toutes sources + purge + embeddings — équivalent hebdomadaire
# de m68-knowledge-sync.yml (qui ne couvre que les sources synchronisées au
# quotidien). Couvre en plus : agglo/uha/associations/open-data/OSM/
# monuments/conseil municipal/emploi (France Travail), sources sans sync
# quotidienne dédiée.
#
# Scindé en jobs parallèles (ciblés via --sources=) plutôt qu'un run
# monolithique séquentiel : un run unique dépassait régulièrement la limite
# de 2h (~45 sources dont plusieurs crawls lents — musées Puppeteer ~30 min
# cumulées, emploi France Travail paginé et parfois lent) — confirmé le
# 2026-07-24, run annulé par timeout après 2h00, bloqué ~24 min sur le
# groupe emploi. Premier split en 5 groupes le même jour : 4/5 sont passés
# largement sous les 60 min, mais "core" (shop/article/news_article/event/
# document/magazine/city_page/wiki/landmark_directory/open_data/osm_poi/
# outing) a lui-même timeout à 1h00 — probablement dominé par indexArticles
# (tout l'historique presse, sans fenêtre temporelle, retraité intégralement
# à chaque run) et/ou city_page (crawl page par page du sitemap mulhouse.fr,
# domaine par ailleurs observé instable/lent sur d'autres groupes). "core"
# re-scindé en 3 le même jour pour isoler ces sources volumineuses les unes
# des autres. runSource() (lib/rag/indexer.ts) logue désormais la durée de
# chaque source individuellement pour affiner ce découpage si besoin.
# Chaque groupe a son propre budget de temps, un groupe lent ou en échec ne
# bloque plus les autres. ensureFtsReady() (lib/rag/indexer.ts) est protégé
# par un verrou advisory Postgres pour tolérer ces démarrages simultanés.
on:
  schedule:
    # Dimanche 4h UTC — index complet toutes sources + purge + embeddings
    - cron: "0 4 * * 0"
  workflow_dispatch:

env:
  JINA_KEY_ENV: github
  TURSO_DATABASE_URL: ${{ secrets.MULHOUSEGPT_TURSO_DATABASE_URL }}
  TURSO_AUTH_TOKEN: ${{ secrets.MULHOUSEGPT_TURSO_AUTH_TOKEN }}
  NEWS_DATABASE_URL: ${{ secrets.MULHOUSEGPT_NEWS_DATABASE_URL }}
  RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
  JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
  FRANCE_TRAVAIL_CLIENT_ID: ${{ secrets.FRANCE_TRAVAIL_CLIENT_ID }}
  FRANCE_TRAVAIL_CLIENT_SECRET: ${{ secrets.FRANCE_TRAVAIL_CLIENT_SECRET }}
  # Articles presse/actualités lus via Convex (scrapers Phase 4) — le job
  # core-articles (sources article,news_article) en a besoin ; NEWS_DATABASE_URL
  # reste en fallback + Cinema/Outing (outings-sync).
  CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
  NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}

permissions:
  contents: read

jobs:
  index:
    strategy:
      # Un job en échec/timeout n'annule pas les autres groupes.
      fail-fast: false
      matrix:
        include:
          - name: core-articles
            sources: article,news_article
          - name: core-pages
            sources: city_page,wiki,landmark_directory
          - name: core-data
            sources: shop,shop_social,event,document,magazine,open_data,osm_poi,outing
          - name: culture-tourisme
            sources: tourism_page,bilingual_plaque,zoo_page,street_art_page,radio_directory,elected_officials,mailbox_directory,post_office_directory,street_directory,quartier_directory,demographics,association_directory,agglo_page,sivom_page,uha_page,universite_populaire_page,piscines_m2a
          - name: musees
            sources: museum_page,railway_page,electropolis_page,textile_museum_page,historical_museum_page,fine_arts_museum_page,mine_museum_page,wallpaper_museum_page,wesserling_page,kunsthalle_page,motoco_page,theatre_sinne_page
          - name: emploi
            sources: job_offer,labour_market_stats,territory_employment,employment_access,hiring_company,employment_event
          - name: administratif
            sources: conseil_municipal_pdf,conseil_municipal_archive,library_page,library_event,airport_page,insee_profile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: Index (${{ matrix.name }})

    steps:
      - name: Checkout MulhouseGPT (deploy key lecture seule)
        uses: actions/checkout@v4
        with:
          repository: Jef-Infojef/MulhouseGPT
          ssh-key: ${{ secrets.MULHOUSEGPT_DEPLOY_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Index RAG — groupe ${{ matrix.name }}
        run: npx tsx scripts/rag-index.ts --sources=${{ matrix.sources }} --skip-embeddings

  embeddings:
    needs: index
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: Backfill embeddings
    steps:
      - name: Checkout MulhouseGPT (deploy key lecture seule)
        uses: actions/checkout@v4
        with:
          repository: Jef-Infojef/MulhouseGPT
          ssh-key: ${{ secrets.MULHOUSEGPT_DEPLOY_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Calculer les embeddings manquants
        run: npx tsx scripts/rag-backfill-embeddings.ts
