name: Check Cookie EBRA - Quotidien

# Verifie une fois par jour que le cookie EBRA debloque toujours le contenu
# premium de L'Alsace. Si ce n'est plus le cas, alerte Telegram.
#
# Volontairement absent de la liste telegram-alert.yml : ce workflow envoie
# sa propre notification, plus informative (ecart de taille observe).

on:
  schedule:
    - cron: '30 7 * * *' # Tous les jours a 07:30 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Postgres du VPS filtré par IP (DOCKER-USER, 22/09) : tunnel SSH avec une clé
      # limitée au transfert vers 127.0.0.1:5432, puis <VPS>:5432 redirigé vers le
      # tunnel sur le runner. Les URL de base restent inchangées. Script en ligne
      # (pas d'action locale) : certains jobs récupèrent un autre dépôt.
      - name: Tunnel SSH vers le Postgres du VPS
        env:
          SSH_HOST: ${{ secrets.VPS_TUNNEL_HOST }}
          SSH_USER: ${{ secrets.VPS_TUNNEL_USER }}
          SSH_KEY: ${{ secrets.VPS_TUNNEL_KEY }}
        run: |
          set -euo pipefail
          # Déjà ouvert par une étape précédente du même job (jobs à deux checkouts)
          if sudo iptables -t nat -C OUTPUT -p tcp -d "$SSH_HOST" --dport 5432 -j DNAT --to-destination 127.0.0.1:15432 2>/dev/null; then echo "Tunnel déjà ouvert"; exit 0; fi
          install -m 600 /dev/null ~/.vps_db_tunnel_key
          echo "$SSH_KEY" > ~/.vps_db_tunnel_key
          ssh -i ~/.vps_db_tunnel_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -fN -L 127.0.0.1:15432:127.0.0.1:5432 "$SSH_USER@$SSH_HOST"
          sudo sysctl -qw net.ipv4.conf.all.route_localnet=1
          sudo iptables -t nat -A OUTPUT -p tcp -d "$SSH_HOST" --dport 5432 -j DNAT --to-destination 127.0.0.1:15432
          for _ in $(seq 1 20); do
            (echo > /dev/tcp/"$SSH_HOST"/5432) 2>/dev/null && { echo "Tunnel prêt"; exit 0; }
            sleep 0.5
          done
          echo "::error::Tunnel vers le Postgres du VPS injoignable"; exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 psycopg2-binary curl_cffi python-dotenv

      - name: Verifier le cookie EBRA
        id: cookie_check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # EBRA_SESSION / EBRA_POOOL vivent dans l'AppConfig de l'Aiven depuis
          # que Convex est coupe pour quota : sans cette variable, le controle
          # relit la source coupee et alerte a tort.
          RAG_DATABASE_URL: ${{ secrets.RAG_DATABASE_URL }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          USE_CONVEX: '1'
        run: |
          python scripts/check_ebra_cookie.py
          echo "cookie_ok=true" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Notifier Telegram (cookie KO)
        if: steps.cookie_check.outcome == 'failure'
        uses: ./.github/actions/telegram
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: alerte
          title: "Cookie EBRA KO — scraping premium en panne"
          body: "Le test quotidien constate que la session ne debloque plus le contenu premium de L'Alsace. Renouveler EBRA_SESSION / EBRA_POOOL dans AppConfig (et le secret ALSACE_COOKIES)."

      - name: Afficher stade OK
        if: steps.cookie_check.outputs.cookie_ok == 'true'
        run: echo "Cookie EBRA OK, rien a signaler."